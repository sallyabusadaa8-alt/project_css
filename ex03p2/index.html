<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors & Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Color Swatch Palette</h1>

    <div class="palette">
        <div class="swatch named">
            <p>Named Color</p>
        </div>

        <div class="swatch hex">
            <p>HEX Color</p>
        </div>

        <div class="swatch rgb">
            <p>RGB Color</p>
        </div>

        <div class="swatch rgba">
            <p>RGBA Color</p>
        </div>
    </div>

    <h2>Opacity vs RGBA</h2>

    <div class="comparison">
        <div class="opacity-box">
            <p>opacity: 0.5</p>
            <span>Child Element</span>
        </div>

        <div class="rgba-box">
            <p>background-color: rgba(0, 0, 255, 0.5)</p>
            <span>Child Element</span>
        </div>
    </div>

</body>
</html>
